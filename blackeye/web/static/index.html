<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackEye — Structural Calculations</title>
<link rel="stylesheet" href="/static/app.css">
<script type="importmap">
{"imports": {"three": "/static/vendor/three/three.module.min.js",
             "three/addons/": "/static/vendor/three/addons/"}}
</script>
</head>
<body>
<header class="top">
  <div class="logo"><span class="eye">◉</span> BlackEye <small data-t="structural calculations">structural calculations</small></div>
  <div class="actions">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="el" title="Ελληνικά">ΕΛ</button><button data-lang="en" title="English">EN</button>
    </div>
    <button id="btn-open" data-t="Open" data-tt="Open project file (Ctrl+O)">Open</button>
    <button id="btn-save" data-t="Save" data-tt="Save project file (Ctrl+S)">Save</button>
    <button id="btn-html" data-t="Export HTML" data-tt="Download report as HTML">Export HTML</button>
    <button id="btn-print" class="primary" data-t="Print / PDF" data-tt="Print or save as PDF (Ctrl+P)">Print / PDF</button>
    <input type="file" id="file-open" accept=".bkeye,.json" hidden>
  </div>
</header>
<main>
  <nav aria-label="Calculation library">
    <input id="search" type="search" autocomplete="off">
    <div id="modules"></div>
    <p id="shortcuts" class="muted pad small"></p>
  </nav>
  <section id="editor">
    <details class="project">
      <summary data-t="Project details">Project details</summary>
      <div class="grid" id="project-fields"></div>
    </details>
    <div class="mod-head">
      <h2 id="mod-title"></h2>
      <button id="btn-reset" class="ghost" data-t="Reset to defaults">Reset to defaults</button>
    </div>
    <p id="mod-desc" class="muted"></p>
    <p id="restored" class="note" hidden data-t="Inputs restored from your last session">Inputs restored</p>
    <div id="status" role="status" aria-live="polite"></div>
    <form id="inputs" autocomplete="off" onsubmit="return false"></form>
  </section>
  <section id="preview">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="report" class="on" data-t="Report">Report</button>
      <button role="tab" data-tab="model" id="tab-model" hidden data-t="3D model">3D model</button>
    </div>
    <div class="pane on" data-pane="report"><iframe id="report" title="Calculation report"></iframe></div>
    <div class="pane" data-pane="model"><div id="viewer3d"></div></div>
  </section>
</main>
<script src="/static/app.js"></script>
<script type="module" src="/static/viewer3d.js"></script>
</body>
</html>
