[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erisma"
version = "0.3.0"
description = "Structural engineering calculation suite (Eurocodes) with professional reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["numpy>=2.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
erisma = "erisma.cli:main"

[tool.setuptools.packages.find]
include = ["erisma*"]

[tool.setuptools.package-data]
"erisma.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
