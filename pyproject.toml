[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackeye"
version = "0.1.0"
description = "Structural engineering calculation suite (Eurocodes) with professional reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["numpy>=2.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
blackeye = "blackeye.cli:main"

[tool.setuptools.packages.find]
include = ["blackeye*"]

[tool.setuptools.package-data]
"blackeye.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
