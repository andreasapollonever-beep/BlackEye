<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Erisma — Structural Calculations</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("erisma.theme")||"dark";if(localStorage.getItem("erisma.side")==="collapsed")document.documentElement.classList.add("pre-collapsed")}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="/static/app.css">
<script type="importmap">
{"imports": {"three": "/static/vendor/three/three.module.min.js",
             "three/addons/": "/static/vendor/three/addons/"}}
</script>
</head>
<body class="at-home">
<header class="top">
  <a href="#" class="logo" id="go-home" title="Αρχική"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 11h26" stroke="#7fc4ff" stroke-width="3.2" stroke-linecap="round"/><path d="M7 13l-4.5 9h9z M25 13l-4.5 9h9z" fill="#fff"/><path d="M1.5 25.5h29" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/></svg> Erisma <small data-t="structural calculations">structural calculations</small></a>
  <div class="actions">
    <button id="btn-home" class="calc-only" data-t="Home">Home</button>
    <button id="btn-theme" data-tt="Dark / light theme" title="Dark / light theme">☾</button>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="el" title="Ελληνικά">ΕΛ</button><button data-lang="en" title="English">EN</button>
    </div>
    <button id="btn-manual" data-t="Manual" data-tt="User manual (F1)" title="User manual (F1)">Manual</button>
    <button id="btn-open" data-t="Open" data-tt="Open project file (Ctrl+O)">Open</button>
    <button id="btn-save" class="calc-only" data-t="Save" data-tt="Save project file (Ctrl+S)">Save</button>
    <button id="btn-html" class="calc-only" data-t="Export HTML" data-tt="Download report as HTML">Export HTML</button>
    <button id="btn-print" class="primary calc-only" data-t="Print / PDF" data-tt="Print or save as PDF (Ctrl+P)">Print / PDF</button>
    <input type="file" id="file-open" accept=".erisma,.bkeye,.json" hidden>
  </div>
</header>
<section id="home" aria-label="Home">
  <div class="home-wrap">
    <div class="hero">
      <h1 data-t="Welcome to Erisma">Welcome to Erisma</h1>
      <p data-t="Choose a calculation to start. Results, checks and the report update while you type.">Choose a calculation to start.</p>
      <div class="hero-actions">
        <input id="home-search" type="search" autocomplete="off">
        <button id="home-continue" class="primary" hidden></button>
        <button id="home-open" class="ghost" data-t="Open project file…">Open project file…</button>
      </div>
    </div>
    <ol class="steps">
      <li><b>1</b><span data-t="Choose a calculation">Choose a calculation</span></li>
      <li><b>2</b><span data-t="Enter your data — the defaults are a realistic worked example">Enter your data</span></li>
      <li><b>3</b><span data-t="Check the results and print the report (PDF)">Print the report</span></li>
    </ol>
    <div id="home-cards"></div>
  </div>
</section>
<main>
  <nav id="side" aria-label="Calculation library">
    <div class="side-top">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" autocomplete="off"><span class="kbd">Ctrl K</span>
      </div>
      <button id="side-toggle" class="icon-btn" type="button" data-tt="Collapse / expand the menu" title="Collapse / expand the menu">«</button>
    </div>
    <div id="modules"></div>
    <div id="shortcuts" class="side-foot"></div>
  </nav>
  <section id="editor">
    <details class="project">
      <summary data-t="Project details">Project details</summary>
      <div class="grid" id="project-fields"></div>
    </details>
    <div class="mod-head">
      <h2 id="mod-title"></h2>
      <a id="mod-help" class="ghost" target="_blank" data-tt="How this calculation works (F1)" title="How this calculation works (F1)">📖</a>
      <button id="btn-reset" class="ghost" data-t="Reset to defaults">Reset to defaults</button>
    </div>
    <p id="mod-desc" class="muted"></p>
    <p id="restored" class="note" hidden data-t="Inputs restored from your last session">Inputs restored</p>
    <div id="status" role="status" aria-live="polite"></div>
    <form id="inputs" autocomplete="off" onsubmit="return false"></form>
  </section>
  <section id="preview">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="report" class="on" data-t="Report">Report</button>
      <button role="tab" data-tab="model" id="tab-model" hidden data-t="3D model">3D model</button>
    </div>
    <div class="pane on" data-pane="report"><iframe id="report" title="Calculation report"></iframe></div>
    <div class="pane" data-pane="model"><div id="viewer3d"></div></div>
  </section>
</main>
<dialog id="map-dlg">
  <div class="map-head">
    <h3 data-t="Project site — seismic zone from the map">Project site</h3>
    <button class="ghost" id="map-close" type="button">✕</button>
  </div>
  <div class="map-body">
    <div class="map-side">
      <input id="map-search" type="search" autocomplete="off">
      <div class="places" id="map-places"></div>
      <button class="ghost" id="map-gps" type="button" data-t="📍 Use my location">📍 Use my location</button>
      <div class="latlon">
        <input id="map-lat" type="number" step="any" placeholder="lat °N">
        <input id="map-lon" type="number" step="any" placeholder="lon °E">
      </div>
      <div class="src" data-t="Click on the map, choose a place or give coordinates.">Click on the map.</div>
    </div>
    <div class="map-wrap" id="map-wrap">
      <img id="map-img" alt="Seismic zoning map" draggable="false">
      <div class="pin" id="map-pin"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z" fill="#e03b3b" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg></div>
    </div>
  </div>
  <div class="map-foot">
    <div class="map-result" id="map-result">—</div>
    <div class="btns">
      <button class="ghost" id="map-cancel" type="button" data-t="Cancel">Cancel</button>
      <button class="primary" id="map-apply" type="button" data-t="Use this site" disabled>Use this site</button>
    </div>
  </div>
</dialog>
<script src="/static/app.js"></script>
<script type="module" src="/static/viewer3d.js"></script>
</body>
</html>
